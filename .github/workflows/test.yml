name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '**.svelte'
      - '**.js'
      - '**.json'
      - 'wrangler.toml'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Test Cloudflare cache boundary
        run: npm run test:cloudflare-cache
